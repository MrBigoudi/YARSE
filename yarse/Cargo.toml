[package]
name = "yarse"
version = "0.1.0"
authors = ["MrBigoudi <yannis.kedadry2@gmail.com>"]
edition = "2021"


[dependencies]
dioxus = { version = "0.7.1", features = ["fullstack", "router"] }
rusqlite = { version = "0.32.0", optional = true }
anyhow = { version = "1.0.101" }

[features]
default = ["web", "server"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
native = ["dioxus/native"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:rusqlite"]
